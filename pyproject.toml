[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-customer-ml"
version = "0.2.0"
description = "Cutoff-aware customer value and repeat-purchase prediction examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "joblib>=1.3,<2",
]

[project.scripts]
customer-ml = "customer_ml.cli:main"

[tool.setuptools.packages.find]
include = ["customer_ml*"]

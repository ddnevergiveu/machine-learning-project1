name: Customer ML checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py train --demo --output-dir artifacts/high-value
      - run: python main.py train --demo --target repeat_purchase --output-dir artifacts/repeat-purchase
      - run: python main.py predict --demo --model artifacts/high-value/model.joblib --output artifacts/predictions.csv
